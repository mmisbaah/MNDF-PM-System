name: Code release gate

on:
  pull_request:
  push:
    branches: [main, codex/release-stabilization]

permissions:
  contents: read

jobs:
  code-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://runtime:ci-only-password@127.0.0.1:5432/not_contacted_during_build
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run accessibility:gate
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Reject high or critical production dependency vulnerabilities
        run: pnpm audit --prod --audit-level high
      - run: pnpm run build
