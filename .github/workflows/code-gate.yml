name: Code release gate

on:
  pull_request:
  push:
    branches: [main, codex/release-stabilization]

permissions:
  contents: read

jobs:
  code-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://runtime:ci-only-password@127.0.0.1:5432/not_contacted_during_build
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run accessibility:gate
      - run: node --check scripts/browser-regression.mjs
      - run: node --check scripts/validate-production-env.mjs
      - run: node --check scripts/verify-tls-boundary.mjs
      - name: Parse production secret initializer
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/initialize-production-secrets.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/verify-windows-host.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install-application-task.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/promote-release.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Reject high or critical dependency vulnerabilities
        run: pnpm audit --audit-level high
      - run: pnpm run build
      - name: Prepare integrity-manifested standalone package
        shell: pwsh
        run: .\scripts\prepare-standalone.ps1
