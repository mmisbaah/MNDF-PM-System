name: Code release gate

on:
  pull_request:
  push:
    branches: [main, codex/release-stabilization]

permissions:
  contents: read

jobs:
  code-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://runtime:ci-only-password@127.0.0.1:5432/not_contacted_during_build
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run accessibility:gate
      - run: node --check scripts/browser-regression.mjs
      - run: node --check scripts/validate-production-env.mjs
      - run: node --check scripts/verify-tls-boundary.mjs
      - run: node --check scripts/release-signing.mjs
      - run: pnpm run release-signing:selftest
      - name: Parse production secret initializer
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/initialize-production-secrets.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/verify-windows-host.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install-application-task.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/promote-release.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}
          foreach($file in @('scripts/set-production-acls.ps1','scripts/verify-production-acls.ps1')){
            $tokens=$null; $errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){$errors | ForEach-Object { Write-Error "$file`: $($_.Message)" }; exit 1}
          }
          foreach($file in @('scripts/start-production.ps1','scripts/install-application-task.ps1','scripts/monitor-production.ps1','scripts/install-monitor-task.ps1')){
            $tokens=$null; $errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){$errors | ForEach-Object { Write-Error "$file`: $($_.Message)" }; exit 1}
          }
      - name: Verify application-log credential redaction
        shell: pwsh
        run: |
          . ./scripts/application-log-redaction.ps1
          $sample='postgresql://runtime:db-password@localhost/db Authorization: Bearer abc.def.ghi password=hunter2 MFA_SECRET=topsecret'
          $redacted=Protect-ApplicationLogLine $sample
          if($redacted -match 'db-password|abc\.def\.ghi|hunter2|topsecret'){throw 'A representative credential survived log redaction'}
          if(([regex]::Matches($redacted,'\[REDACTED\]')).Count -ne 4){throw 'Expected four redacted credential values'}
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Reject high or critical dependency vulnerabilities
        run: pnpm audit --audit-level high
      - run: pnpm run build
      - name: Prepare integrity-manifested standalone package
        shell: pwsh
        run: .\scripts\prepare-standalone.ps1
